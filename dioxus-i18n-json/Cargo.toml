[package]
name = "dioxus-i18n-json"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
readme = "README.md"
description = "A lightweight i18n library for Dioxus with JSON-based translations, hot reload, and typed keys."

[features]
default = []
hot-reload = ["notify", "tokio"]

[dependencies]
dioxus = "0.7.10"
dioxus-i18n-json-macro = { version = "0.0.5", path = "../dioxus-i18n-json-macro" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
icu_plurals = "2.2"
icu_locale = "2.2"

notify = { version = "6.1", optional = true }
tokio = { version = "1.53", features = ["rt-multi-thread", "time", "sync"], optional = true }
